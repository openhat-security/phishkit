services:
  integration:
    build:
      context: ../..
      dockerfile: tests/integration/Dockerfile
    working_dir: /src
    environment:
      PHISHKIT_CONFIG: /tmp/phishkit-test/config
      PHISHKIT_DATA: /tmp/phishkit-test/data
      PHISHKIT_ROOT: /src
      PHISHKIT_TEST_BIN: /src/target/release/phishkit
      VIDEO: ${VIDEO:-}
      DISPLAY: ":99"
      CARGO_BUILD_JOBS: "2"
    volumes:
      - ../..:/src
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
      - cargo-target:/src/target

volumes:
  cargo-registry:
  cargo-git:
  cargo-target:
